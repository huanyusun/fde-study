version: 2
semantic_models:
- name: orders
  model: ref('orders')
  description: 一行一笔订单，按下单日期统计。
  defaults:
    agg_time_dimension: ordered_at
  entities:
  - name: order
    type: primary
    expr: order_id
  - name: member
    type: foreign
    expr: member_id
  - name: store
    type: foreign
    expr: store_id
  dimensions:
  - name: ordered_at
    type: time
    type_params:
      time_granularity: day
  - name: status
    type: categorical
  - name: channel
    type: categorical
  measures:
  - name: m_order_count
    expr: order_id
    agg: count
  - name: m_paid_order_count
    expr: case when status = 'paid' then order_id end
    agg: count
  - name: m_valid_order_count
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then order_id
      end
    agg: count
  - name: m_cancelled_order_count
    expr: case when status = 'cancelled' then order_id end
    agg: count
  - name: m_refund_order_count
    expr: case when status = 'paid' and refund_cents > 0 then order_id end
    agg: count
  - name: m_partial_refund_order_count
    expr: case when status = 'paid' and refund_cents > 0 and refund_cents < paid_cents
      then order_id end
    agg: count
  - name: m_full_refund_order_count
    expr: case when status = 'paid' and paid_cents > 0 and refund_cents = paid_cents
      then order_id end
    agg: count
  - name: m_payment_cents
    expr: case when status = 'paid' then paid_cents else 0 end
    agg: sum
  - name: m_refund_cents
    expr: case when status = 'paid' then refund_cents else 0 end
    agg: sum
  - name: m_net_sales_cents
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then paid_cents
      - refund_cents else 0 end
    agg: sum
  - name: m_gross_cents
    expr: case when status = 'paid' then gross_cents else 0 end
    agg: sum
  - name: m_discount_cents
    expr: case when status = 'paid' then gross_cents - paid_cents else 0 end
    agg: sum
  - name: m_buyer_count
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then member_id
      end
    agg: count_distinct
  - name: m_refund_buyer_count
    expr: case when status = 'paid' and refund_cents > 0 then member_id end
    agg: count_distinct
  - name: m_selling_store_count
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then store_id
      end
    agg: count_distinct
  - name: m_valid_order_items
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then quantity
      else 0 end
    agg: sum
- name: members
  model: ref('members')
  description: 一行一份 CRM 会员账户，按注册日期统计。
  defaults:
    agg_time_dimension: registered_at
  entities:
  - name: member
    type: primary
    expr: member_id
  - name: home_store
    type: foreign
    expr: home_store_id
  dimensions:
  - name: registered_at
    type: time
    type_params:
      time_granularity: day
  - name: tier
    type: categorical
  measures:
  - name: m_new_member_count
    expr: member_id
    agg: count
- name: stores_selling
  model: ref('stores')
  description: 一行一间门店，作为订单成交门店角色。
  entities:
  - name: store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
  - name: store_name
    type: categorical
  measures: []
- name: stores_home
  model: ref('stores')
  description: 一行一间门店，作为会员归属门店角色。
  entities:
  - name: home_store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
  - name: store_name
    type: categorical
  measures: []
- name: cards
  model: ref('cards')
  description: 一行一张会员卡，账户可对应多张卡。
  defaults:
    agg_time_dimension: valid_from
  entities:
  - name: card
    type: primary
    expr: card_id
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: card_type
    type: categorical
  - name: valid_from
    type: time
    type_params:
      time_granularity: day
  - name: valid_until
    type: time
    type_params:
      time_granularity: day
  - name: ended_at
    type: categorical
  measures: []
- name: member_purchase_seq
  model: ref('member_purchase_seq')
  description: 订单粒度的有效购买序列，标记全测试覆盖期内每账户第一笔与第二笔及以后的有效订单。
  defaults:
    agg_time_dimension: ordered_at
  entities:
  - name: purchase_order
    type: primary
    expr: order_id
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: ordered_at
    type: time
    type_params:
      time_granularity: day
  - name: is_first
    type: categorical
  - name: is_repeat
    type: categorical
  measures:
  - name: m_repeat_order_count
    expr: case when is_repeat then order_id end
    agg: count
- name: member_first_orders
  model: ref('member_first_orders')
  description: 账户粒度首单表，一行一账户，记录全测试覆盖期内第一笔有效订单的日期与净销售额。
  defaults:
    agg_time_dimension: first_ordered_at
  entities:
  - name: first_purchase_member
    type: primary
    expr: member_id
  dimensions:
  - name: first_ordered_at
    type: time
    type_params:
      time_granularity: day
  measures:
  - name: m_first_buyer_count
    expr: member_id
    agg: count_distinct
  - name: m_first_order_sales_cents
    expr: first_net_sales_cents
    agg: sum
  - name: m_first_order_count
    expr: member_id
    agg: count
- name: monthly_buyers
  model: ref('monthly_buyers')
  description: 账户×自然月粒度，记录每账户当月有效订单数。
  defaults:
    agg_time_dimension: stat_month
  entities:
  - name: member_month
    type: primary
    expr: member_month_key
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: stat_month
    type: time
    type_params:
      time_granularity: month
  measures:
  - name: m_monthly_buyer
    expr: member_id
    agg: count_distinct
  - name: m_monthly_repeat_buyer
    expr: case when valid_order_cnt >= 2 then member_id end
    agg: count_distinct
- name: paid_member_month
  model: ref('paid_member_month')
  description: 账户×自然月粒度，标记月末付费资格并保留当月有效订单数与净销售额。
  defaults:
    agg_time_dimension: stat_month
  entities:
  - name: paid_member_month_key
    type: primary
    expr: member_month_key
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: stat_month
    type: time
    type_params:
      time_granularity: month
  - name: paid_eligible
    type: categorical
  measures:
  - name: m_paid_buyer
    expr: case when paid_eligible then member_id end
    agg: count_distinct
  - name: m_paid_order
    expr: case when paid_eligible then valid_order_cnt else 0 end
    agg: sum
  - name: m_paid_sales
    expr: case when paid_eligible then net_sales_cents else 0 end
    agg: sum
  - name: m_paid_repeat_buyer
    expr: case when paid_eligible and valid_order_cnt >= 2 then member_id end
    agg: count_distinct
metrics:
- name: order_count
  label: 创建订单数
  description: 按下单日期统计全部订单，每个订单号一次，包含取消单。
  type: simple
  type_params:
    measure: m_order_count
- name: paid_order_count
  label: 支付订单数
  description: 状态为 paid 的订单数，包括后来全部退款的订单。
  type: simple
  type_params:
    measure: m_paid_order_count
- name: valid_order_count
  label: 有效订单数
  description: 状态为 paid 且实付金额减退款金额大于零的订单数；取消和全退不计。
  type: simple
  type_params:
    measure: m_valid_order_count
- name: cancelled_order_count
  label: 取消订单数
  description: 状态为 cancelled 的订单数。
  type: simple
  type_params:
    measure: m_cancelled_order_count
- name: refund_order_count
  label: 退款订单数
  description: paid 状态且退款金额大于零的订单数，包括部分退款与全部退款。
  type: simple
  type_params:
    measure: m_refund_order_count
- name: partial_refund_order_count
  label: 部分退款订单数
  description: paid 状态且退款大于零、小于实付金额的订单数。
  type: simple
  type_params:
    measure: m_partial_refund_order_count
- name: full_refund_order_count
  label: 全额退款订单数
  description: paid 状态且实付大于零、退款等于实付的订单数。
  type: simple
  type_params:
    measure: m_full_refund_order_count
- name: payment_cents
  label: 实付金额
  description: paid 订单实付金额合计，尚未扣退款；单位分。
  type: simple
  type_params:
    measure: m_payment_cents
- name: refund_cents
  label: 退款金额
  description: paid 订单退款金额合计，按原订单下单日期归属；单位分。
  type: simple
  type_params:
    measure: m_refund_cents
- name: net_sales_cents
  label: 净销售额
  description: paid 订单实付减退款后合计；取消单不计；按原订单下单日期归属；单位分。
  type: simple
  type_params:
    measure: m_net_sales_cents
- name: gross_cents
  label: 支付订单原价金额
  description: paid 订单折扣前原价金额合计；单位分。
  type: simple
  type_params:
    measure: m_gross_cents
- name: discount_cents
  label: 优惠金额
  description: paid 订单原价减实付的金额合计；退款不冲减原优惠金额；单位分。
  type: simple
  type_params:
    measure: m_discount_cents
- name: buyer_count
  label: 购买会员数
  description: 统计窗口内有有效订单的不同 CRM 会员账户数，不做跨系统自然人去重。
  type: simple
  type_params:
    measure: m_buyer_count
- name: refund_buyer_count
  label: 退款会员数
  description: 统计窗口内发生退款的 paid 订单关联的不同 CRM 会员账户数。
  type: simple
  type_params:
    measure: m_refund_buyer_count
- name: selling_store_count
  label: 成交门店数
  description: 窗口内至少有一笔有效订单的不同订单归属门店数。
  type: simple
  type_params:
    measure: m_selling_store_count
- name: valid_order_items
  label: 有效订单商品件数
  description: 有效订单中的原始购买件数合计；不是净商品销量。
  type: simple
  type_params:
    measure: m_valid_order_items
- name: avg_order_value
  label: 有效订单均额
  description: 净销售额除以有效订单数，单位分／单；分母为零时未定义。
  type: derived
  type_params:
    expr: case when valid_order_count = 0 then null else net_sales_cents / valid_order_count
      end
    metrics:
    - net_sales_cents
    - valid_order_count
- name: avg_buyer_value
  label: 购买会员人均消费
  description: 净销售额除以购买会员数，单位分／账户；分母为零时未定义。
  type: derived
  type_params:
    expr: case when buyer_count = 0 then null else net_sales_cents / buyer_count end
    metrics:
    - net_sales_cents
    - buyer_count
- name: purchase_frequency
  label: 购买频次
  description: 有效订单数除以购买会员数，单位单／账户；分母为零时未定义。
  type: derived
  type_params:
    expr: case when buyer_count = 0 then null else valid_order_count / buyer_count
      end
    metrics:
    - valid_order_count
    - buyer_count
- name: refund_amount_rate
  label: 退款金额占比
  description: 退款金额除以实付金额；分母为零时未定义。
  type: derived
  type_params:
    expr: case when payment_cents = 0 then null else refund_cents / payment_cents
      end
    metrics:
    - refund_cents
    - payment_cents
- name: cancel_rate
  label: 取消率
  description: 取消订单数除以创建订单数；分母为零时未定义。
  type: derived
  type_params:
    expr: case when order_count = 0 then null else cancelled_order_count / order_count
      end
    metrics:
    - cancelled_order_count
    - order_count
- name: refund_order_rate
  label: 退款订单率
  description: 退款订单数除以支付订单数；分母为零时未定义。
  type: derived
  type_params:
    expr: case when paid_order_count = 0 then null else refund_order_count / paid_order_count
      end
    metrics:
    - refund_order_count
    - paid_order_count
- name: discount_rate
  label: 优惠率
  description: 优惠金额除以支付订单原价金额；分母为零时未定义。
  type: derived
  type_params:
    expr: case when gross_cents = 0 then null else discount_cents / gross_cents end
    metrics:
    - discount_cents
    - gross_cents
- name: items_per_order
  label: 单均商品件数
  description: 有效订单商品件数除以有效订单数；分母为零时未定义。
  type: derived
  type_params:
    expr: case when valid_order_count = 0 then null else valid_order_items / valid_order_count
      end
    metrics:
    - valid_order_items
    - valid_order_count
- name: new_member_count
  label: 注册会员数
  description: 按注册日期统计新注册 CRM 账户数；不等于自然人数。
  type: simple
  type_params:
    measure: m_new_member_count
- name: first_buyer_count
  label: 观测期首购会员数
  description: 在测试覆盖期内首次有效订单落入查询窗口的不同 CRM 账户数；先用全覆盖历史确定首次，再按窗口筛选。
  type: simple
  type_params:
    measure: m_first_buyer_count
- name: first_order_sales_cents
  label: 观测期首单净销售额
  description: 每个账户在测试覆盖期内第一笔有效订单的净销售额，按该单日期归属；相同日期按订单号排序；单位分。
  type: simple
  type_params:
    measure: m_first_order_sales_cents
- name: first_order_count
  label: 观测期首单数
  description: 在全测试覆盖期内先为每个账户按日期、订单号排序，其第一笔有效订单落入窗口的单数。
  type: simple
  type_params:
    measure: m_first_order_count
- name: repeat_order_count
  label: 观测期后续购买订单数
  description: 账户全测试覆盖期内第二笔及以后的有效订单，按订单日期落入窗口计数。
  type: simple
  type_params:
    measure: m_repeat_order_count
- name: monthly_buyer_count
  label: 月内购买会员数
  description: 同一自然月有至少一笔有效订单的账户数，仅整月、全门店口径；跨月不得加总。
  type: simple
  type_params:
    measure: m_monthly_buyer
- name: monthly_repeat_buyer_count
  label: 月内复购会员数
  description: 同一自然月有至少两笔有效订单的账户数，仅整月、全门店口径。
  type: simple
  type_params:
    measure: m_monthly_repeat_buyer
- name: monthly_repeat_rate
  label: 月内复购率
  description: 同一自然月的月内复购会员数除以月内购买会员数，仅整月、全门店口径；分母为零时未定义。
  type: derived
  type_params:
    expr: case when monthly_buyer_count = 0 then null else monthly_repeat_buyer_count
      / monthly_buyer_count end
    metrics:
    - monthly_repeat_buyer_count
    - monthly_buyer_count
- name: monthly_paid_buyer_count
  label: 月末付费会员购买人数
  description: 自然月内有至少一笔有效订单、且月末符合总部运营月报付费资格（悦享年卡、家庭季卡，按账户去重）的不同账户数。
  type: simple
  type_params:
    measure: m_paid_buyer
- name: monthly_paid_order_count
  label: 月末付费会员有效订单数
  description: 月末符合付费资格的账户在该自然月的全部有效订单数，按账户资格筛选，不按卡重复。
  type: simple
  type_params:
    measure: m_paid_order
- name: monthly_paid_sales_cents
  label: 月末付费会员净销售额
  description: 月末符合付费资格的账户在该自然月的有效订单净销售额合计，单位分。
  type: simple
  type_params:
    measure: m_paid_sales
- name: monthly_paid_repeat_buyer_count
  label: 月末付费会员复购人数
  description: 月末符合付费资格，且同一自然月至少有两笔有效订单的不同账户数。
  type: simple
  type_params:
    measure: m_paid_repeat_buyer
- name: monthly_paid_repeat_rate
  label: 月末付费会员复购率
  description: 月末付费会员复购人数除以月末付费会员购买人数；分母为零时未定义。
  type: derived
  type_params:
    expr: case when monthly_paid_buyer_count = 0 then null else monthly_paid_repeat_buyer_count
      / monthly_paid_buyer_count end
    metrics:
    - monthly_paid_repeat_buyer_count
    - monthly_paid_buyer_count
- name: monthly_paid_avg_order_value
  label: 月末付费会员订单均额
  description: 月末付费会员净销售额除以月末付费会员有效订单数，单位分／单；分母为零时未定义。
  type: derived
  type_params:
    expr: case when monthly_paid_order_count = 0 then null else monthly_paid_sales_cents
      / monthly_paid_order_count end
    metrics:
    - monthly_paid_sales_cents
    - monthly_paid_order_count
