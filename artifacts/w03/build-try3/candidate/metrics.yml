version: 2
semantic_models:
- name: orders
  model: ref('orders')
  defaults:
    agg_time_dimension: ordered_at
  entities:
  - name: order
    type: primary
    expr: order_id
  - name: member
    type: foreign
    expr: member_id
  - name: store
    type: foreign
    expr: store_id
  dimensions:
  - name: ordered_at
    type: time
    type_params:
      time_granularity: day
  - name: status
    type: categorical
  - name: channel
    type: categorical
  measures:
  - name: order_count_measure
    expr: order_id
    agg: count
- name: members
  model: ref('members')
  defaults:
    agg_time_dimension: registered_at
  entities:
  - name: member
    type: primary
    expr: member_id
  - name: home_store
    type: foreign
    expr: home_store_id
  dimensions:
  - name: registered_at
    type: time
    type_params:
      time_granularity: day
  - name: tier
    type: categorical
  measures: []
- name: stores_selling
  model: ref('stores')
  entities:
  - name: store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
  - name: store_name
    type: categorical
  measures: []
- name: stores_home
  model: ref('stores')
  entities:
  - name: home_store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
  - name: store_name
    type: categorical
  measures: []
- name: cards
  model: ref('cards')
  defaults:
    agg_time_dimension: valid_from
  entities:
  - name: card
    type: primary
    expr: card_id
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: valid_from
    type: time
    type_params:
      time_granularity: day
  - name: card_type
    type: categorical
  measures: []
metrics:
- name: order_count
  label: 创建订单数
  description: 按下单日期统计全部订单，每个订单号一次，包含取消单。
  type: simple
  type_params:
    measure: order_count_measure
