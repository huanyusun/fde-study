version: 2
semantic_models:
- name: order_facts
  model: ref('orders')
  description: 一行一笔订单，含取消单
  defaults:
    agg_time_dimension: ordered_at
  entities:
  - name: order
    type: primary
    expr: order_id
  - name: member
    type: foreign
    expr: member_id
  - name: store
    type: foreign
    expr: store_id
  dimensions:
  - name: ordered_at
    type: time
    type_params:
      time_granularity: day
  - name: status
    type: categorical
  - name: channel
    type: categorical
  measures:
  - name: order_cnt
    expr: order_id
    agg: count
  - name: paid_order_cnt
    expr: case when status = 'paid' then 1 else 0 end
    agg: sum
  - name: valid_order_cnt
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then 1 else
      0 end
    agg: sum
  - name: cancelled_order_cnt
    expr: case when status = 'cancelled' then 1 else 0 end
    agg: sum
  - name: refund_order_cnt
    expr: case when status = 'paid' and refund_cents > 0 then 1 else 0 end
    agg: sum
  - name: partial_refund_order_cnt
    expr: case when status = 'paid' and refund_cents > 0 and refund_cents < paid_cents
      then 1 else 0 end
    agg: sum
  - name: full_refund_order_cnt
    expr: case when status = 'paid' and paid_cents > 0 and refund_cents = paid_cents
      then 1 else 0 end
    agg: sum
  - name: payment_amt
    expr: case when status = 'paid' then paid_cents else 0 end
    agg: sum
  - name: refund_amt
    expr: case when status = 'paid' then refund_cents else 0 end
    agg: sum
  - name: net_amt
    expr: case when status = 'paid' then paid_cents - refund_cents else 0 end
    agg: sum
  - name: gross_amt
    expr: case when status = 'paid' then gross_cents else 0 end
    agg: sum
  - name: discount_amt
    expr: case when status = 'paid' then gross_cents - paid_cents else 0 end
    agg: sum
  - name: buyer_cnt
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then member_id
      end
    agg: count_distinct
  - name: refund_buyer_cnt
    expr: case when status = 'paid' and refund_cents > 0 then member_id end
    agg: count_distinct
  - name: selling_store_cnt
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then store_id
      end
    agg: count_distinct
  - name: valid_items
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then quantity
      else 0 end
    agg: sum
- name: member_accounts
  model: ref('members')
  description: 一行一份 CRM 会员账户
  defaults:
    agg_time_dimension: registered_at
  entities:
  - name: member
    type: primary
    expr: member_id
  - name: home_store
    type: foreign
    expr: home_store_id
  dimensions:
  - name: registered_at
    type: time
    type_params:
      time_granularity: day
  - name: tier
    type: categorical
  measures:
  - name: new_member_cnt
    expr: member_id
    agg: count
- name: selling_stores
  model: ref('stores')
  description: 一行一间门店，作为订单成交门店角色
  entities:
  - name: store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
  - name: store_name
    type: categorical
- name: home_stores
  model: ref('stores')
  description: 一行一间门店，作为会员归属门店角色
  entities:
  - name: home_store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
  - name: store_name
    type: categorical
- name: member_cards
  model: ref('cards')
  description: 一行一张会员卡，账户可对应多张卡
  entities:
  - name: card
    type: primary
    expr: card_id
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: card_type
    type: categorical
  - name: valid_from
    type: time
    type_params:
      time_granularity: day
  - name: valid_until
    type: time
    type_params:
      time_granularity: day
  - name: ended_at
    type: time
    type_params:
      time_granularity: day
- name: first_order_per_member
  model: ref('first_order_per_member')
  description: 一行一个账户在测试覆盖期内的首笔有效订单
  defaults:
    agg_time_dimension: first_ordered_at
  entities:
  - name: first_order
    type: primary
    expr: member_id
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: first_ordered_at
    type: time
    type_params:
      time_granularity: day
  measures:
  - name: first_buyer_cnt
    expr: member_id
    agg: count_distinct
  - name: first_order_sales
    expr: first_net_cents
    agg: sum
  - name: first_order_cnt
    expr: order_id
    agg: count
- name: repeat_valid_orders
  model: ref('repeat_valid_orders')
  description: 账户全测试覆盖期内第二笔及以后的有效订单，一行一笔
  defaults:
    agg_time_dimension: ordered_at
  entities:
  - name: repeat_order
    type: primary
    expr: order_id
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: ordered_at
    type: time
    type_params:
      time_granularity: day
  measures:
  - name: repeat_order_cnt
    expr: order_id
    agg: count
- name: member_month_valid_orders
  model: ref('member_month_valid_orders')
  description: 一行一个账户×自然月的有效订单聚合
  defaults:
    agg_time_dimension: month_start
  entities:
  - name: member_month
    type: primary
    expr: member_month
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: month_start
    type: time
    type_params:
      time_granularity: month
  measures:
  - name: m_buyer_cnt
    expr: member_id
    agg: count_distinct
  - name: m_repeat_buyer_cnt
    expr: case when valid_order_cnt >= 2 then member_id end
    agg: count_distinct
- name: paid_member_month
  model: ref('paid_member_month')
  description: 一行一个月末符合付费资格的账户×自然月
  defaults:
    agg_time_dimension: month_start
  entities:
  - name: paid_member_month
    type: primary
    expr: member_month
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: month_start
    type: time
    type_params:
      time_granularity: month
  measures:
  - name: pmp_buyer_cnt
    expr: member_id
    agg: count_distinct
  - name: pmp_order_cnt
    expr: valid_order_cnt
    agg: sum
  - name: pmp_sales
    expr: net_cents
    agg: sum
  - name: pmp_repeat_buyer_cnt
    expr: case when valid_order_cnt >= 2 then member_id end
    agg: count_distinct
metrics:
- name: order_count
  label: 创建订单数
  description: 按下单日期统计全部订单，每个订单号一次，包含取消单
  type: simple
  type_params:
    measure: order_cnt
- name: paid_order_count
  label: 支付订单数
  description: 状态为 paid 的订单数，包括后来全部退款的订单
  type: simple
  type_params:
    measure: paid_order_cnt
- name: valid_order_count
  label: 有效订单数
  description: 状态为 paid 且实付金额减退款金额大于零的订单数；取消和全退不计
  type: simple
  type_params:
    measure: valid_order_cnt
- name: cancelled_order_count
  label: 取消订单数
  description: 状态为 cancelled 的订单数
  type: simple
  type_params:
    measure: cancelled_order_cnt
- name: refund_order_count
  label: 退款订单数
  description: paid 状态且退款金额大于零的订单数，包括部分退款与全部退款
  type: simple
  type_params:
    measure: refund_order_cnt
- name: partial_refund_order_count
  label: 部分退款订单数
  description: paid 状态且退款大于零、小于实付金额的订单数
  type: simple
  type_params:
    measure: partial_refund_order_cnt
- name: full_refund_order_count
  label: 全额退款订单数
  description: paid 状态且实付大于零、退款等于实付的订单数
  type: simple
  type_params:
    measure: full_refund_order_cnt
- name: payment_cents
  label: 实付金额
  description: paid 订单实付金额合计，尚未扣退款，单位分
  type: simple
  type_params:
    measure: payment_amt
- name: refund_cents
  label: 退款金额
  description: paid 订单退款金额合计，按原订单下单日期归属，单位分
  type: simple
  type_params:
    measure: refund_amt
- name: net_sales_cents
  label: 净销售额
  description: paid 订单实付减退款后合计，取消单不计，按原订单下单日期归属，单位分
  type: simple
  type_params:
    measure: net_amt
- name: gross_cents
  label: 支付订单原价金额
  description: paid 订单折扣前原价金额合计，单位分
  type: simple
  type_params:
    measure: gross_amt
- name: discount_cents
  label: 优惠金额
  description: paid 订单原价减实付的金额合计，退款不冲减原优惠金额，单位分
  type: simple
  type_params:
    measure: discount_amt
- name: buyer_count
  label: 购买会员数
  description: 统计窗口内有有效订单的不同 CRM 会员账户数，不做跨系统自然人去重
  type: simple
  type_params:
    measure: buyer_cnt
- name: refund_buyer_count
  label: 退款会员数
  description: 统计窗口内发生退款的 paid 订单关联的不同 CRM 会员账户数
  type: simple
  type_params:
    measure: refund_buyer_cnt
- name: selling_store_count
  label: 成交门店数
  description: 窗口内至少有一笔有效订单的不同订单归属门店数
  type: simple
  type_params:
    measure: selling_store_cnt
- name: valid_order_items
  label: 有效订单商品件数
  description: 有效订单中的原始购买件数合计
  type: simple
  type_params:
    measure: valid_items
- name: avg_order_value
  label: 有效订单均额
  description: 净销售额除以有效订单数，单位分／单；分母为零时未定义
  type: derived
  type_params:
    expr: case when valid_order_count = 0 then null else net_sales_cents / valid_order_count
      end
    metrics:
    - net_sales_cents
    - valid_order_count
- name: avg_buyer_value
  label: 购买会员人均消费
  description: 净销售额除以购买会员数，单位分／账户；分母为零时未定义
  type: derived
  type_params:
    expr: case when buyer_count = 0 then null else net_sales_cents / buyer_count end
    metrics:
    - net_sales_cents
    - buyer_count
- name: purchase_frequency
  label: 购买频次
  description: 有效订单数除以购买会员数，单位单／账户；分母为零时未定义
  type: derived
  type_params:
    expr: case when buyer_count = 0 then null else valid_order_count / buyer_count
      end
    metrics:
    - valid_order_count
    - buyer_count
- name: refund_amount_rate
  label: 退款金额占比
  description: 退款金额除以实付金额；分母为零时未定义
  type: derived
  type_params:
    expr: case when payment_cents = 0 then null else refund_cents / payment_cents
      end
    metrics:
    - refund_cents
    - payment_cents
- name: cancel_rate
  label: 取消率
  description: 取消订单数除以创建订单数；分母为零时未定义
  type: derived
  type_params:
    expr: case when order_count = 0 then null else cancelled_order_count / order_count
      end
    metrics:
    - cancelled_order_count
    - order_count
- name: refund_order_rate
  label: 退款订单率
  description: 退款订单数除以支付订单数；分母为零时未定义
  type: derived
  type_params:
    expr: case when paid_order_count = 0 then null else refund_order_count / paid_order_count
      end
    metrics:
    - refund_order_count
    - paid_order_count
- name: discount_rate
  label: 优惠率
  description: 优惠金额除以支付订单原价金额；分母为零时未定义
  type: derived
  type_params:
    expr: case when gross_cents = 0 then null else discount_cents / gross_cents end
    metrics:
    - discount_cents
    - gross_cents
- name: items_per_order
  label: 单均商品件数
  description: 有效订单商品件数除以有效订单数；分母为零时未定义
  type: derived
  type_params:
    expr: case when valid_order_count = 0 then null else valid_order_items / valid_order_count
      end
    metrics:
    - valid_order_items
    - valid_order_count
- name: new_member_count
  label: 注册会员数
  description: 按注册日期统计新注册 CRM 账户数，不等于自然人数
  type: simple
  type_params:
    measure: new_member_cnt
- name: first_buyer_count
  label: 观测期首购会员数
  description: 在测试覆盖期内首次有效订单落入查询窗口的不同 CRM 账户数，不代表终身首购
  type: simple
  type_params:
    measure: first_buyer_cnt
- name: first_order_sales_cents
  label: 观测期首单净销售额
  description: 每账户在测试覆盖期内第一笔有效订单的净销售额，相同日期按订单号排序，单位分
  type: simple
  type_params:
    measure: first_order_sales
- name: first_order_count
  label: 观测期首单数
  description: 先按全覆盖历史为每账户按日期、订单号排序确定首单，首单落入窗口的单数
  type: simple
  type_params:
    measure: first_order_cnt
- name: repeat_order_count
  label: 观测期后续购买订单数
  description: 账户全测试覆盖期内第二笔及以后的有效订单，按订单日期落入窗口计数
  type: simple
  type_params:
    measure: repeat_order_cnt
- name: monthly_buyer_count
  label: 月内购买会员数
  description: 同一自然月有至少一笔有效订单的账户数，仅整月、全门店口径
  type: simple
  type_params:
    measure: m_buyer_cnt
  query_policy:
    full_month_only: true
  constraints:
  - 仅完整自然月、全门店全渠道
- name: monthly_repeat_buyer_count
  label: 月内复购会员数
  description: 同一自然月有至少两笔有效订单的账户数，仅整月、全门店口径
  type: simple
  type_params:
    measure: m_repeat_buyer_cnt
  query_policy:
    full_month_only: true
  constraints:
  - 仅完整自然月、全门店全渠道
- name: monthly_repeat_rate
  label: 月内复购率
  description: 同一自然月的月内复购会员数除以月内购买会员数；分母为零时未定义；跨多月查询必须按月展示
  type: derived
  type_params:
    expr: case when monthly_buyer_count = 0 then null else monthly_repeat_buyer_count
      / monthly_buyer_count end
    metrics:
    - monthly_repeat_buyer_count
    - monthly_buyer_count
  query_policy:
    full_month_only: true
  constraints:
  - 仅完整自然月、全门店全渠道
- name: monthly_paid_buyer_count
  label: 月末付费会员购买人数
  description: 自然月内有至少一笔有效订单、且月末符合付费资格的不同账户数，按账户去重不按卡重复；分母口径仅完整自然月、全门店全渠道
  type: simple
  type_params:
    measure: pmp_buyer_cnt
  query_policy:
    full_month_only: true
  constraints:
  - 仅完整自然月、全门店全渠道
- name: monthly_paid_order_count
  label: 月末付费会员有效订单数
  description: 月末符合付费资格的账户在该自然月的全部有效订单数，不按卡重复
  type: simple
  type_params:
    measure: pmp_order_cnt
  query_policy:
    full_month_only: true
  constraints:
  - 仅完整自然月、全门店全渠道
- name: monthly_paid_sales_cents
  label: 月末付费会员净销售额
  description: 月末符合付费资格的账户在该自然月的有效订单净销售额合计，单位分
  type: simple
  type_params:
    measure: pmp_sales
  query_policy:
    full_month_only: true
  constraints:
  - 仅完整自然月、全门店全渠道
- name: monthly_paid_repeat_buyer_count
  label: 月末付费会员复购人数
  description: 月末符合付费资格，且同一自然月至少有两笔有效订单的不同账户数
  type: simple
  type_params:
    measure: pmp_repeat_buyer_cnt
  query_policy:
    full_month_only: true
  constraints:
  - 仅完整自然月、全门店全渠道
- name: monthly_paid_repeat_rate
  label: 月末付费会员复购率
  description: 月末付费会员复购人数除以月末付费会员购买人数；分母为零时未定义；仅完整自然月、全门店全渠道
  type: derived
  type_params:
    expr: case when monthly_paid_buyer_count = 0 then null else monthly_paid_repeat_buyer_count
      / monthly_paid_buyer_count end
    metrics:
    - monthly_paid_repeat_buyer_count
    - monthly_paid_buyer_count
  query_policy:
    full_month_only: true
  constraints:
  - 仅完整自然月、全门店全渠道
- name: monthly_paid_avg_order_value
  label: 月末付费会员订单均额
  description: 月末付费会员净销售额除以月末付费会员有效订单数，单位分／单；分母为零时未定义；仅完整自然月、全门店全渠道
  type: derived
  type_params:
    expr: case when monthly_paid_order_count = 0 then null else monthly_paid_sales_cents
      / monthly_paid_order_count end
    metrics:
    - monthly_paid_sales_cents
    - monthly_paid_order_count
  query_policy:
    full_month_only: true
  constraints:
  - 仅完整自然月、全门店全渠道
