version: 2
semantic_models:
- name: orders
  model: ref('orders')
  defaults:
    agg_time_dimension: ordered_at
  entities:
  - name: order
    type: primary
    expr: order_id
  - name: member
    type: foreign
    expr: member_id
  - name: store
    type: foreign
    expr: store_id
  dimensions:
  - name: ordered_at
    type: time
    type_params:
      time_granularity: day
  - name: status
    type: categorical
  - name: channel
    type: categorical
  measures:
  - name: order_created_count
    expr: order_id
    agg: count
  - name: paid_order_count_m
    expr: case when status = 'paid' then 1 else 0 end
    agg: sum
  - name: payment_cents_m
    expr: case when status = 'paid' then paid_cents else 0 end
    agg: sum
metrics:
- name: order_count
  label: 创建订单数
  description: 按下单日期统计全部订单，每个订单号一次，包含取消单。
  type: simple
  type_params:
    measure: order_created_count
- name: paid_order_count
  label: 支付订单数
  description: 状态为 paid 的订单数，包括后来全部退款的订单。
  type: simple
  type_params:
    measure: paid_order_count_m
- name: payment_cents
  label: 实付金额
  description: paid 订单实付金额合计，尚未扣退款；单位分。
  type: simple
  type_params:
    measure: payment_cents_m
