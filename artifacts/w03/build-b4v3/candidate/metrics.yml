version: 2
semantic_models:
- name: orders
  model: ref('orders')
  description: 订单表，一行一笔订单。
  defaults:
    agg_time_dimension: ordered_at
  entities:
  - name: order
    type: primary
    expr: order_id
  - name: member
    type: foreign
    expr: member_id
  - name: store
    type: foreign
    expr: store_id
  dimensions:
  - name: ordered_at
    type: time
    type_params:
      time_granularity: day
  - name: status
    type: categorical
  - name: channel
    type: categorical
  measures:
  - name: order_count_measure
    expr: order_id
    agg: count
  - name: paid_order_count_measure
    expr: case when status = 'paid' then order_id end
    agg: count
  - name: valid_order_count_measure
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then order_id
      end
    agg: count
  - name: cancelled_order_count_measure
    expr: case when status = 'cancelled' then order_id end
    agg: count
  - name: refund_order_count_measure
    expr: case when status = 'paid' and refund_cents > 0 then order_id end
    agg: count
  - name: partial_refund_order_count_measure
    expr: case when status = 'paid' and refund_cents > 0 and refund_cents < paid_cents
      then order_id end
    agg: count
  - name: full_refund_order_count_measure
    expr: case when status = 'paid' and paid_cents > 0 and refund_cents = paid_cents
      then order_id end
    agg: count
  - name: payment_cents_measure
    expr: case when status = 'paid' then paid_cents else 0 end
    agg: sum
  - name: refund_cents_measure
    expr: case when status = 'paid' then refund_cents else 0 end
    agg: sum
  - name: net_sales_cents_measure
    expr: case when status = 'paid' then paid_cents - refund_cents else 0 end
    agg: sum
  - name: gross_cents_measure
    expr: case when status = 'paid' then gross_cents else 0 end
    agg: sum
  - name: discount_cents_measure
    expr: case when status = 'paid' then gross_cents - paid_cents else 0 end
    agg: sum
  - name: buyer_count_measure
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then member_id
      end
    agg: count_distinct
  - name: refund_buyer_count_measure
    expr: case when status = 'paid' and refund_cents > 0 then member_id end
    agg: count_distinct
  - name: selling_store_count_measure
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then store_id
      end
    agg: count_distinct
  - name: valid_order_items_measure
    expr: case when status = 'paid' and paid_cents - refund_cents > 0 then quantity
      else 0 end
    agg: sum
- name: members
  model: ref('members')
  description: 会员账户表，一行一个 CRM 账户。
  defaults:
    agg_time_dimension: registered_at
  entities:
  - name: member
    type: primary
    expr: member_id
  - name: home_store
    type: foreign
    expr: home_store_id
  dimensions:
  - name: registered_at
    type: time
    type_params:
      time_granularity: day
  - name: tier
    type: categorical
  measures:
  - name: new_member_count_measure
    expr: member_id
    agg: count
- name: stores_selling
  model: ref('stores')
  description: 门店表，成交门店角色。
  entities:
  - name: store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
  - name: store_name
    type: categorical
  measures: []
- name: stores_home
  model: ref('stores')
  description: 门店表，会员归属门店角色。
  entities:
  - name: home_store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
  - name: store_name
    type: categorical
  measures: []
- name: cards
  model: ref('cards')
  description: 会员卡表，一行一张卡。
  defaults:
    agg_time_dimension: valid_from
  entities:
  - name: card
    type: primary
    expr: card_id
  - name: member
    type: foreign
    expr: member_id
  dimensions:
  - name: valid_from
    type: time
    type_params:
      time_granularity: day
  - name: card_type
    type: categorical
  measures: []
- name: account_month_general
  model: ref('account_month_general')
  description: 账户月度有效订单表，一行一个账户一个自然月，account_month_key 为账户与月起点拼接的代理键。
  defaults:
    agg_time_dimension: month_start
  entities:
  - name: account_month
    type: primary
    expr: account_month_key
  dimensions:
  - name: month_start
    type: time
    type_params:
      time_granularity: month
  - name: member_id
    type: categorical
  measures:
  - name: monthly_buyer_count_measure
    expr: member_id
    agg: count
  - name: monthly_repeat_buyer_count_measure
    expr: case when valid_order_cnt >= 2 then member_id end
    agg: count
metrics:
- name: monthly_buyer_count
  label: 月内购买会员数
  description: 同一自然月有至少一笔有效订单的账户数，仅整月、全门店口径；按账户去重，多月分别展示、不能跨月加总。
  type: simple
  type_params:
    measure: monthly_buyer_count_measure
- name: monthly_repeat_buyer_count
  label: 月内复购会员数
  description: 同一自然月有至少两笔有效订单的账户数，仅整月、全门店口径。
  type: simple
  type_params:
    measure: monthly_repeat_buyer_count_measure
- name: monthly_repeat_rate
  label: 月内复购率
  description: 同一自然月的月内复购会员数除以月内购买会员数，仅整月、全门店口径；分母为零时未定义，输出 null。
  type: derived
  type_params:
    expr: case when monthly_buyer_count = 0 then null else monthly_repeat_buyer_count
      / monthly_buyer_count end
    metrics:
    - monthly_repeat_buyer_count
    - monthly_buyer_count
